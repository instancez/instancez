# yaml-language-server: $schema=https://docs.instancez.ai/schema/instancez.json
version: 1

project:
  name: "my-app"

# Providers back the features declared below: a storage provider is required
# whenever you declare storage buckets, and an email provider is required when
# auth.email.verify_email is true. "local" writes uploads to ./uploads.
providers:
  storage:
    type: local
  # To send auth emails, add an email provider and set verify_email: true below:
  # email:
  #   type: resend
  #   api_key: $INSTANCEZ_RESEND_API_KEY

auth:
  jwt_expiry: 15m
  refresh_token_expiry: 7d
  allow_anonymous: false  # empty-body anonymous sign-in; off by default

  email:
    verify_email: false

tables:
  # One profile per user: the row id is the auth user's id.
  profiles:
    rls_enabled: true
    fields:
      - name: id
        primary_key: true
        foreign_key:
          references: auth.users.id
          on_delete: cascade
      - name: name
        type: text
        required: true
      - name: avatar_path      # path in the avatars bucket below, under <user id>/
        type: text

    rls:
      # Profiles are readable by anyone signed in; users manage only their own.
      - operations: [select]
        using: "auth.is_authenticated()"
      - operations: [insert]
        with_check: "id = auth.uid()"
      - operations: [update]
        using: "id = auth.uid()"
        with_check: "id = auth.uid()"
      - operations: [delete]
        using: "id = auth.uid()"

  todos:
    rls_enabled: true
    fields:
      - name: id
        type: bigserial
        primary_key: true
      - name: user_id
        foreign_key:
          references: auth.users.id
          on_delete: cascade
      - name: title
        type: text
        required: true
      - name: status
        type: text
        required: true
        enum: [pending, active, done]
        default: pending
      - name: priority
        type: integer
        default: 0
      - name: created_at
        type: timestamptz
        required: true
        default: now()

    rls:
      - operations: [select, insert, update, delete]
        using: "user_id = auth.uid()"
        with_check: "user_id = auth.uid()"

# Storage buckets: file uploads served at /storage/v1/object/<bucket>/<path>.
# Access is governed by RLS, exactly like tables.
storage:
  avatars:
    public: true          # anyone can download via /object/public; listing follows rls
    max_size: 5MB
    types: [image/*]
    rls:
      # Signed-in users list avatars; each user writes only under <their user id>/.
      - operations: [select]
        using: "auth.is_authenticated()"
      - operations: [insert]
        with_check: "name LIKE auth.uid()::text || '/%'"
      - operations: [update]
        using: "name LIKE auth.uid()::text || '/%'"
        with_check: "name LIKE auth.uid()::text || '/%'"
      - operations: [delete]
        using: "name LIKE auth.uid()::text || '/%'"

# Code functions: JavaScript HTTP handlers served at /functions/v1/<name>.
# Source + shared deps live in ./functions (run by Node workers). See
# functions/todos.js — a working CRUD handler over the todos table above.
functions:
  todos:
    runtime: node
    file: functions/todos.js
    auth_required: true   # instancez returns 401 for anonymous callers
