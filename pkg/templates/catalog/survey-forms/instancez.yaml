version: 1
project:
  name: Survey Forms
  description: Form builder with validated public submissions
auth:
  jwt_expiry: 1h
  refresh_tokens: true
  refresh_token_expiry: 7d
tables:
  forms:
    fields:
      - name: id
        type: bigserial
        primary_key: true
      - name: owner_id
        required: true
        foreign_key: { references: auth.users.id, on_delete: cascade }
      - name: title
        type: text
        required: true
        check: "char_length(title) between 1 and 200"
      - name: description
        type: text
        check: "char_length(description) <= 2000"
      - name: closes_at
        type: timestamptz
      - name: status
        type: text
        required: true
        default: draft
        enum: [draft, open, closed]
      - name: created_at
        type: timestamptz
        required: true
        default: now()
    indexes:
      - columns: [owner_id, created_at]
    rls:
      - operations: [select]
        using: "status = 'open' OR owner_id = auth.uid()"
      - operations: [insert]
        with_check: "owner_id = auth.uid()"
      - operations: [update]
        using: "owner_id = auth.uid()"
        with_check: "owner_id = auth.uid()"
      - operations: [delete]
        using: "owner_id = auth.uid()"
  questions:
    fields:
      - name: id
        type: bigserial
        primary_key: true
      - name: form_id
        type: bigint
        required: true
        foreign_key: { references: forms.id, on_delete: cascade }
      - name: position
        type: integer
        required: true
        default: 0
        min: 0
      - name: type
        type: text
        required: true
        enum: [text, choice, rating]
      - name: prompt
        type: text
        required: true
        check: "char_length(prompt) between 1 and 500"
      - name: options
        type: jsonb
        check: "options IS NULL OR (jsonb_typeof(options) = 'array' AND jsonb_array_length(options) BETWEEN 1 AND 50)"
      - name: required
        type: boolean
        required: true
        default: false
      - name: max_rating
        type: integer
        required: true
        default: 5
        min: 3
        max: 10
    indexes:
      - columns: [form_id, position]
    rls:
      - operations: [select]
        using: "EXISTS (SELECT 1 FROM forms f WHERE f.id = questions.form_id AND (f.status = 'open' OR f.owner_id = auth.uid()))"
      - operations: [insert]
        with_check: "EXISTS (SELECT 1 FROM forms f WHERE f.id = questions.form_id AND f.owner_id = auth.uid())"
      - operations: [update]
        using: "EXISTS (SELECT 1 FROM forms f WHERE f.id = questions.form_id AND f.owner_id = auth.uid())"
        with_check: "EXISTS (SELECT 1 FROM forms f WHERE f.id = questions.form_id AND f.owner_id = auth.uid())"
      - operations: [delete]
        using: "EXISTS (SELECT 1 FROM forms f WHERE f.id = questions.form_id AND f.owner_id = auth.uid())"
  responses:
    fields:
      - name: id
        type: bigserial
        primary_key: true
      - name: form_id
        type: bigint
        required: true
        foreign_key: { references: forms.id, on_delete: cascade }
      - name: answers
        type: jsonb
        required: true
      - name: created_at
        type: timestamptz
        required: true
        default: now()
    indexes:
      - columns: [form_id, created_at]
    rls:
      - operations: [select]
        using: "EXISTS (SELECT 1 FROM forms f WHERE f.id = responses.form_id AND f.owner_id = auth.uid())"
      # No insert policy: only the submit-response function (service role) writes responses.
      - operations: [delete]
        using: "EXISTS (SELECT 1 FROM forms f WHERE f.id = responses.form_id AND f.owner_id = auth.uid())"
functions:
  submit-response:
    runtime: node
    file: functions/submit-response.js
    auth_required: false
    timeout: 15s
rpc:
  results_summary:
    description: Per-question counts, averages and answer totals for a form you own
    auth_required: true
    language: plpgsql
    volatility: stable
    args:
      - name: p_form_id
        type: bigint
        required: true
    returns:
      type: jsonb
    body: |
      BEGIN
        IF NOT EXISTS (SELECT 1 FROM public.forms f WHERE f.id = p_form_id AND f.owner_id = auth.uid()) THEN
          RAISE EXCEPTION 'form not found';
        END IF;
        RETURN (
          WITH c AS (
            SELECT e.key AS qid, e.value AS v, count(*) AS n
            FROM public.responses r CROSS JOIN LATERAL jsonb_each_text(r.answers) e
            WHERE r.form_id = p_form_id AND e.value IS NOT NULL
            GROUP BY 1, 2
          )
          SELECT jsonb_build_object(
            'total_responses', (SELECT count(*) FROM public.responses r WHERE r.form_id = p_form_id),
            'questions', COALESCE((
              SELECT jsonb_agg(jsonb_build_object(
                'id', q.id,
                'prompt', q.prompt,
                'type', q.type,
                'answered', COALESCE((SELECT sum(c.n) FROM c WHERE c.qid = q.id::text), 0),
                'average', CASE WHEN q.type = 'rating' THEN
                  (SELECT round(sum(c.v::numeric * c.n) / NULLIF(sum(c.n), 0), 2) FROM c WHERE c.qid = q.id::text AND c.v ~ '^[0-9]{1,9}$')
                  END,
                'counts', CASE WHEN q.type IN ('choice', 'rating') THEN
                  (SELECT COALESCE(jsonb_object_agg(c.v, c.n), '{}'::jsonb) FROM c WHERE c.qid = q.id::text)
                  END
              ) ORDER BY q.position, q.id)
              FROM public.questions q WHERE q.form_id = p_form_id), '[]'::jsonb)
          )
        );
      END;
