version: 1
project:
  name: Newsletter
  description: Double opt-in newsletter with issues and Resend delivery
auth:
  jwt_expiry: 1h
  refresh_tokens: true
  refresh_token_expiry: 7d
tables:
  profiles:
    rls_enabled: true
    fields:
      - name: id
        primary_key: true
        foreign_key: { references: auth.users.id, on_delete: cascade }
      - name: display_name
        type: text
      - name: role
        type: text
        required: true
        default: user
        enum: [user, admin]
    rls:
      - operations: [select]
        using: "auth.uid() = id OR public.is_admin()"
      - operations: [insert]
        with_check: "auth.uid() = id AND role = 'user'"
      - operations: [update]
        using: "auth.uid() = id"
        with_check: "auth.uid() = id AND role = public.my_role()"
  subscribers:
    rls_enabled: true
    fields:
      - name: id
        type: bigserial
        primary_key: true
      - name: email
        type: text
        required: true
        check: "length(email) <= 254 AND email = lower(email) AND email ~ '^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$'"
      - name: status
        type: text
        required: true
        default: pending
        enum: [pending, confirmed, unsubscribed]
      - name: confirm_token
        type: text
        required: true
      - name: unsubscribe_token
        type: text
        required: true
      - name: source
        type: text
      - name: created_at
        type: timestamptz
        required: true
        default: now()
      - name: confirm_sent_at
        type: timestamptz
        required: true
        default: now()
      - name: confirmed_at
        type: timestamptz
      - name: unsubscribed_at
        type: timestamptz
    indexes:
      - columns: [email]
        unique: true
      - columns: [confirm_token]
        unique: true
      - columns: [unsubscribe_token]
        unique: true
      - columns: [status]
      - columns: [confirm_sent_at]
    rls:
      - operations: [select]
        using: "public.is_admin()"
      - operations: [update]
        using: "public.is_admin()"
        with_check: "public.is_admin()"
      - operations: [delete]
        using: "public.is_admin()"
  issues:
    rls_enabled: true
    fields:
      - name: id
        type: bigserial
        primary_key: true
      - name: subject
        type: text
        required: true
        check: "length(subject) BETWEEN 1 AND 200"
      - name: preview_text
        type: text
        check: "length(preview_text) <= 200"
      - name: body_html
        type: text
        required: true
        check: "length(body_html) BETWEEN 1 AND 500000"
      - name: status
        type: text
        required: true
        default: draft
        enum: [draft, sending, sent]
      - name: recipient_count
        type: integer
        required: true
        default: 0
        min: 0
      - name: created_at
        type: timestamptz
        required: true
        default: now()
      - name: sent_at
        type: timestamptz
    indexes:
      - columns: [status, created_at]
    rls:
      - operations: [select]
        using: "public.is_admin()"
      - operations: [insert]
        with_check: "public.is_admin() AND status = 'draft'"
      - operations: [update]
        using: "public.is_admin() AND status = 'draft'"
        with_check: "public.is_admin()"
      - operations: [delete]
        using: "public.is_admin() AND status = 'draft'"
  sends:
    rls_enabled: true
    fields:
      - name: issue_id
        type: bigint
        primary_key: true
        foreign_key: { references: issues.id, on_delete: cascade }
      - name: subscriber_id
        type: bigint
        primary_key: true
        foreign_key: { references: subscribers.id, on_delete: cascade }
      - name: sent_at
        type: timestamptz
        required: true
        default: now()
    indexes:
      - columns: [subscriber_id]
    rls:
      - operations: [select]
        using: "public.is_admin()"
functions:
  subscribe:
    runtime: node
    file: functions/subscribe.js
    auth_required: false
    timeout: 20s
    env:
      RESEND_API_KEY: ${INSTANCEZ_ENV_RESEND_API_KEY:-}
      FROM_ADDRESS: ${INSTANCEZ_ENV_FROM_ADDRESS:-Newsletter <onboarding@resend.dev>}
      PUBLIC_BASE_URL: ${INSTANCEZ_ENV_PUBLIC_BASE_URL:-}
  confirm:
    runtime: node
    file: functions/confirm.js
    auth_required: false
    timeout: 10s
  unsubscribe:
    runtime: node
    file: functions/unsubscribe.js
    auth_required: false
    timeout: 10s
  send-issue:
    runtime: node
    file: functions/send-issue.js
    auth_required: true
    timeout: 120s
    env:
      RESEND_API_KEY: ${INSTANCEZ_ENV_RESEND_API_KEY:-}
      FROM_ADDRESS: ${INSTANCEZ_ENV_FROM_ADDRESS:-Newsletter <onboarding@resend.dev>}
      PUBLIC_BASE_URL: ${INSTANCEZ_ENV_PUBLIC_BASE_URL:-}
rpc:
  my_role:
    auth_required: false
    language: plpgsql
    volatility: stable
    security: definer
    set: { search_path: public }
    returns:
      type: text
    body: |
      BEGIN RETURN (SELECT role FROM profiles WHERE id = auth.uid()); END;
  is_admin:
    auth_required: false
    language: plpgsql
    volatility: stable
    security: definer
    set: { search_path: public }
    returns:
      type: boolean
    body: |
      BEGIN RETURN (SELECT EXISTS (SELECT 1 FROM profiles WHERE id = auth.uid() AND role = 'admin')); END;
  subscriber_stats:
    auth_required: true
    language: sql
    volatility: stable
    security: invoker
    returns:
      type: "table(status text, total bigint)"
    body: |
      SELECT s.status, count(*) FROM subscribers s GROUP BY s.status ORDER BY s.status
